<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resto Discovery – Route-Based Restaurant Finder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark">🍽️</span>
          <div class="brand-text">
            <h1>Resto Discovery</h1>
            <p>Find the perfect stop along your route</p>
          </div>
        </div>
      </header>

      <main class="app-main">
        <section class="controls">
          <form id="route-form" class="card">
            <h2>Plan your food stop</h2>

            <div class="field-group">
              <label for="start">Starting point</label>
              <input
                id="start"
                name="start"
                type="text"
                placeholder="e.g. Bengaluru Airport"
                required
              />
            </div>

            <div class="field-group">
              <label for="end">Destination</label>
              <input
                id="end"
                name="end"
                type="text"
                placeholder="e.g. Mysuru Palace"
                required
              />
            </div>

            <div class="field-row">
              <div class="field-group">
                <label for="journeyTime">Journey start time</label>
                <input id="journeyTime" name="journeyTime" type="time" required />
              </div>
              <div class="field-group">
                <label for="mealTime">Target meal time</label>
                <input id="mealTime" name="mealTime" type="time" required />
              </div>
            </div>

            <div class="field-row">
              <div class="field-group">
                <label for="cuisine">Cuisine (optional)</label>
                <input
                  id="cuisine"
                  name="cuisine"
                  type="text"
                  placeholder="e.g. Indian, Italian"
                />
              </div>
              <div class="field-group">
                <label for="openNow">
                  <input id="openNow" type="checkbox" />
                  Only show places likely open
                </label>
              </div>
            </div>

            <button type="submit" class="primary-button">
              Find restaurants along the route
            </button>

            <p class="hint">
              Results are based on Google Maps directions and places along your
              route. Set your API key in <code>app.js</code>.
            </p>
          </form>

          <section class="results card">
            <div class="results-header">
              <h2>Suggested stops</h2>
              <span id="result-count" class="pill pill-muted">No results yet</span>
            </div>
            <div
              id="cuisine-filter"
              class="cuisine-filter"
              aria-label="Filter results by cuisine"
            ></div>
            <ol id="restaurant-list" class="restaurant-list"></ol>
            <div id="error" class="error-message" hidden></div>
          </section>
        </section>

        <section class="map-panel card">
          <div class="map-header">
            <h2>Route map</h2>
            <span class="pill">Powered by Google Maps</span>
          </div>
          <div id="map" class="map"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
    <!-- TODO: Replace YOUR_API_KEY_HERE with your actual key -->
    <script
      async
      defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDqKeq3a0O__Mm7EQLy0zrHYuJUq8Ly1Ps&libraries=places,geometry&callback=initMap"
    ></script>
  </body>
  </html>
